<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>DeepSeek Harness</title>
    <style>
      body{font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;display:flex;align-items:center;justify-content:center;height:100vh;margin:0;background:#151517;color:#eee}
      #box{text-align:center}
      .spinner{width:36px;height:36px;margin:0 auto 16px;border:3px solid #444;border-top-color:#4e9fff;border-radius:50%;animation:spin 1s linear infinite}
      @keyframes spin{to{transform:rotate(360deg)}}
    </style>
  </head>
  <body>
    <div id="box">
      <div class="spinner"></div>
      <p>Starting DeepSeek Harness…</p>
    </div>
  </body>
</html>
