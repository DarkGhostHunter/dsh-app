name: Build & Release (AppImage)

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      RUSTUP_TOOLCHAIN: stable
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Setup Rust toolchain
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          profile: minimal
          override: true

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.0-dev libgtk-3-dev build-essential libayatana-appindicator3-dev libgdk-pixbuf2.0-dev

      - name: Build web assets (minimal)
        run: npm run build:web

      - name: Install tauri CLI
        run: cargo install tauri-cli --locked || true

      - name: Build Tauri (AppImage)
        run: |
          cd src-tauri
          cargo tauri build --release

      - name: Create GitHub Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref_name }}
          release_name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false

      - name: Upload AppImage
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: src-tauri/target/release/bundle/appimage/*.AppImage
          asset_name: dsh-app.AppImage
          asset_content_type: application/octet-stream

      - name: Generate release manifest
        run: |
          ASSET_URL="https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/dsh-app.AppImage"
          PUB_DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          cat > manifest.json <<EOF
          {
            "version": "${{ github.ref_name }}",
            "notes": "Release ${{ github.ref_name }}",
            "pub_date": "$PUB_DATE",
            "platforms": [
              {
                "name": "linux-x86_64",
                "url": "$ASSET_URL"
              }
            ]
          }
          EOF

      - name: Upload manifest
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: manifest.json
          asset_name: manifest.json
          asset_content_type: application/json