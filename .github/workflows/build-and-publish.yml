# Trigger on push tags and on repository_dispatch (used to trigger builds from external repo)
on:
  push:
    tags:
      - 'v*.*.*'
  repository_dispatch:
    types: [release-published]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      RUSTUP_TOOLCHAIN: stable
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18
      - name: Setup Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          override: true
      - name: Install dependencies and build web assets
        run: |
          npm ci
          npm run build
      - name: Build Tauri bundles
        run: |
          cd src-tauri
          # build release (this will create platform bundles via tauri-bundler)
          cargo build --release
          # If you use `cargo tauri build`, run that instead:
          # cargo tauri build
      - name: Upload release artifacts
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          body: "Automatic release for ${{ github.ref }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Upload files to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-release-asset@v1
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./src-tauri/target/release/bundle/
          asset_name: your-artifacts.zip
          asset_content_type: application/zip