name: Build Tauri AppImage on upstream release

on:
  repository_dispatch:
    types: [deepseek-release]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-appimage:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout dsh-app
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install system deps for Tauri Linux
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libssl-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Clone deepseek-harness
        run: |
          rm -rf deepseek-harness
          git clone --depth 1 https://github.com/deepseek-ai/deepseek-harness.git deepseek-harness
          if [ -n "${{ github.event.client_payload.tag }}" ]; then
            cd deepseek-harness
            git fetch --tags --depth=1
            git checkout "${{ github.event.client_payload.tag }}" || true
            cd ..
          fi

      - name: Build deepseek-harness
        working-directory: deepseek-harness
        run: |
          npm ci
          npm run build

      - name: Copy build output into Tauri dist
        run: |
          rm -rf dist
          mkdir -p dist
          if [ -d deepseek-harness/dist ]; then
            cp -a deepseek-harness/dist/. dist/
          elif [ -d deepseek-harness/.next ]; then
            cp -a deepseek-harness/.next/. dist/
          else
            echo "No build output found in deepseek-harness"
            ls -la deepseek-harness
            exit 1
          fi

      - name: Install Tauri CLI
        run: cargo install tauri-cli --locked --version "^2.0"

      - name: Build AppImage
        run: cargo tauri build --bundles appimage

      - name: Determine tag and release name
        id: release_meta
        run: |
          if [ -n "${{ github.event.client_payload.tag }}" ]; then
            echo "tag=${{ github.event.client_payload.tag }}" >> $GITHUB_OUTPUT
            echo "name=${{ github.event.client_payload.name }}" >> $GITHUB_OUTPUT
            echo "body=${{ github.event.client_payload.body }}" >> $GITHUB_OUTPUT
          else
            echo "tag=v$(date +%Y.%m.%d.%H%M%S)" >> $GITHUB_OUTPUT
            echo "name=DeepSeek Harness Desktop" >> $GITHUB_OUTPUT
            echo "body=Automated desktop AppImage build" >> $GITHUB_OUTPUT
          fi

      - name: Create GitHub Release
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_meta.outputs.tag }}
          name: ${{ steps.release_meta.outputs.name }}
          body: ${{ steps.release_meta.outputs.body }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload AppImage
        uses: actions/upload-release-asset@v1
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./src-tauri/target/release/bundle/appimage/*.AppImage
          asset_name: deepseek-harness-desktop.AppImage
          asset_content_type: application/octet-stream