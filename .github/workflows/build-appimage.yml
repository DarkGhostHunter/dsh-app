name: Build AppImage from upstream release

# Builds the deepseek-harness Desktop Electron app at a given upstream tag
# with upstream's own packaging pipeline (patched for a linux-x64 target) and
# publishes the AppImage as a GitHub Release. Triggered manually, by the
# watch-upstream poller, or by repository_dispatch.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Upstream tag to build (e.g. dsh-v0.2.1-rc.2). Empty = latest tag.'
        required: false
        default: ''
  repository_dispatch:
    types: [deepseek-release]

permissions:
  contents: write

jobs:
  build-appimage:
    runs-on: ubuntu-latest

    steps:
      - name: Resolve upstream tag
        id: tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${{ github.event.client_payload.tag || inputs.tag }}"
          if [ -z "$TAG" ]; then
            TAG=$(gh api repos/deepseek-ai/deepseek-harness/tags --jq '[.[].name | select(test("^dsh-v[0-9]+\\.[0-9]+\\.[0-9]+(-[0-9A-Za-z.-]+)?$"))][0]')
          fi
          if [ -z "$TAG" ]; then
            echo "No upstream tag found" >&2
            exit 1
          fi
          echo "Building upstream tag: $TAG"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Checkout dsh-app
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set pnpm store path
        run: pnpm config set store-dir "$GITHUB_WORKSPACE/.pnpm-store"

      # The upstream lockfile changes every release, so the exact key misses on
      # a new tag; restore-keys still reuses most of the store and only the new
      # and changed packages are fetched from the registry.
      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: .pnpm-store
          key: pnpm-store-${{ steps.tag.outputs.tag }}
          restore-keys: pnpm-store-

      - name: Clone deepseek-harness at tag
        run: |
          rm -rf deepseek-harness
          git clone --depth 1 --branch "${{ steps.tag.outputs.tag }}" \
            https://github.com/deepseek-ai/deepseek-harness.git deepseek-harness

      - name: Cache packaging downloads
        uses: actions/cache@v4
        with:
          path: deepseek-harness/apps/desktop/.desktop-build/downloads
          # Electron, the primary-runtime Node and Python archives, and the
          # wheel set are stable within a release line.
          key: dsh-downloads-${{ steps.tag.outputs.tag }}
          restore-keys: dsh-downloads-

      # electron-builder fetches its AppImage/linuxdeploy tooling on first use.
      - name: Cache electron-builder tools
        uses: actions/cache@v4
        with:
          path: ~/.cache/electron-builder
          key: electron-builder-linux-x64

      - name: Install upstream dependencies
        working-directory: deepseek-harness
        run: pnpm install --frozen-lockfile

      # Upstream ships mac/win release targets only. This patch registers a
      # linux-x64 target across its packaging scripts (build paths, Electron
      # executable layout, CLI launcher, smoke test) and gives the existing
      # linux electron-builder block an icon and executable name. Everything
      # else — runtime preparation, dsh tree assembly, verification — is
      # upstream's own pipeline, unmodified.
      - name: Apply Linux packaging patch
        working-directory: deepseek-harness
        run: git apply --verbose ../patches/linux-packaging.patch

      # The packaging pipeline's smoke test executes Electron directly.
      - name: Install Electron shared libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libnspr4 libnss3 libatk1.0-0 libatk-bridge2.0-0 libcups2 libdrm2 \
            libxkbcommon0 libxcomposite1 libxdamage1 libxfixes3 libxrandr2 \
            libgbm1 libpango-1.0-0 libcairo2
          sudo apt-get install -y libasound2 || sudo apt-get install -y libasound2t64

      # Unsigned: Linux needs no signing credentials, and this skips upstream's
      # COS update-feed wiring, which this repository cannot publish.
      - name: Package linux-x64 AppImage
        working-directory: deepseek-harness
        run: pnpm --filter @deepseek-ai/dsh-desktop run package -- linux-x64 --unsigned

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: DeepSeek Harness Desktop ${{ steps.tag.outputs.tag }}
          body: |
            Desktop AppImage wrapper for [deepseek-ai/deepseek-harness](https://github.com/deepseek-ai/deepseek-harness) at `${{ steps.tag.outputs.tag }}`, built with upstream's own Electron Desktop packaging pipeline (linux-x64, unsigned).
          draft: false
          prerelease: ${{ contains(steps.tag.outputs.tag, '-') }}
          files: deepseek-harness/apps/desktop/.desktop-build/targets/linux-x64/unsigned-artifacts/*.AppImage
